name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build archives
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="astrum_${VERSION#v}_${os}_${arch}"
            mkdir "$name"
            for cmd in astrum astrum-bench; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" -o "$name/$cmd" "./cmd/$cmd"
            done
            cp -R web/build/client "$name/web"
            cp LICENSE README.md "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$VERSION")
          if [[ $VERSION == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" "${flags[@]}" dist/*
